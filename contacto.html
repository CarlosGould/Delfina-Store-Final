<!-- formulario de contacto -->

<form
  action="https://formspree.io/f/xqpkqpga"
  class="fs-form fs-layout__2-column"
  target="_top"
  method="POST"
>
  <div class="fs-field">
    <label class="fs-label" for="name">Nombre Completo</label>
    <input class="fs-input" id="name" name="name" required />
  </div>
  <div class="fs-field">
    <label class="fs-label" for="email">Email</label>
    <input class="fs-input" id="email" name="email" required />
  </div>
  <div class="fs-field">
    <label class="fs-label" for="phone-number">Número de Teléfono</label>
    <input
      class="fs-input"
      id="phone-number"
      name="phone-number"
      placeholder="(XXX) XXX-XXXX"
    />
  </div>

  <div class="fs-field">
    <label class="fs-label" for="Department">Provincia</label>
    <input class="fs-input" id="Department" name="Department" required />
  </div>
  <div class="fs-field">
    <label class="fs-label" for="media-type">Pedido</label>
    <select class="fs-select" id="media-type" name="media-type" required>
      <option value="juguete">Juguete</option>
      <option value="mueble">Mueble</option>
      <option value="accesorio">Accesorio</option>
    </select>
  </div>
  <div class="fs-field">
    <label class="fs-label" for="description">
      Descripción del pedido solicitado
    </label>
    <textarea
      class="fs-textarea"
      id="description"
      name="description"
      required
    ></textarea>
  </div>
  <div class="fs-field">
    <label class="fs-label" for="date">Fecha de Entrega</label>
    <input class="fs-input" id="date" name="date" placeholder="MM-DD-YYYY" />
  </div>
  <div class="fs-field">
    <label class="fs-label">Método de Entrega Preferido</label>
    <div class="fs-radio-group">
      <div class="fs-radio-field">
        <div class="fs-radio-wrapper">
          <input
            class="fs-radio"
            id="delivery-method-email-attachment"
            name="delivery-method"
            required
            type="radio"
            value="email-attachment"
          />
        </div>
        <div>
          <label class="fs-label" for="delivery-method-email-attachment">
            Envio a cargo del comprador.
          </label>
        </div>
      </div>
      <div class="fs-radio-field">
        <div class="fs-radio-wrapper">
          <input
            class="fs-radio"
            id="delivery-method-url"
            name="delivery-method"
            required
            type="radio"
            value="url"
          />
        </div>
        <div>
          <label class="fs-label" for="delivery-method-url">Retiro sucursal</label>
        </div>
      </div>
      <div class="fs-radio-field">
        <div class="fs-radio-wrapper">
          <input
            class="fs-radio"
            id="delivery-method-physical-copy"
            name="delivery-method"
            required
            type="radio"
            value="physical-copy"
          />
        </div>
        <div>
          <label class="fs-label" for="delivery-method-physical-copy">
            Envio a hogar.
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="fs-field">
    <label class="fs-label" for="comments">Cualquier Comentario Adicional</label>
    <textarea class="fs-textarea" id="comments" name="comments"></textarea>
  </div>
  <div class="fs-button-group">
    <button class="fs-button" type="submit">Enviar</button>
  </div>
</form>
