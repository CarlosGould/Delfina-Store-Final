<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delfina Store</title>
    <link rel="stylesheet" href=".\css\styles.css" />
    <link rel="stylesheet" href=".\css\home.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

 <div class="header">
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <a href="index.html"><img src=".\img\logopng.png" alt="Delfina Store" width="125px" /></a>
      </div>
      <nav>
        <ul id="MenuItems">
          <li><a href="index.html">Home</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="registro.html">Registro</a></li>
        </ul>
      </nav>
     
      
    </div>
  </div>
  </div>
  </head>
<body>
    <!-- Botón del carrito -->
    <div class="position-relative">
      <a
        href="#"
        class="btn btn_shopping cart-badge position-fixed top-0 end-0 me-4 mt-3 swing-on-hover border bg-white"
      >
        <i class="bi bi-bag-heart"></i>
        <span
          id="contador-carrito"
          class="position-absolute top-1 start-100 translate-middle badge rounded-pill bg-danger"
        >
          0
        </span>
      </a>
    </div>

    <!-- Contenedor principal de productos -->
    <div class="container my-5">
      <h1 class="text-center fw-bold">Elije su proximo sueño!!</h1>
      <div id="productos-container" class="row g-4 mt-4"></div>
    </div>

    <!-- Offcanvas del carrito -->
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="offcanvasRight"
      aria-labelledby="offcanvasRightLabel"
    >
      <div class="offcanvas-header border-bottom">
        <h4 class="offcanvas-title text-center">Carrito de compras</h4>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>

      <div class="offcanvas-body border-bottom"></div>

      <div class="offcanvas-footer mt-4">
        <h5 class="justify-content-between mb-2">
          <span class="fw-bold px-3">SUBTOTAL:</span>
          <span id="subtotal" class="fw-bold float-end px-2 fs-2"> $0.00 </span>
        </h5>
        <div class="text-center mb-5 px-3">
          <button class="btn btn-primary mt-5 w-100" onclick="generarPedidoWhatsApp()">
            Enviar pedido por WhatsApp
          </button>
        </div>
      </div>
    </div>



<div class="footer-col-4">
        <h3>Siguenos en nuestras redes!!</h3>
        <ul>
          <li>Facebook</li>
          <li>Twitter</li>
          <li>Instagram</li>
          <li>YouTube</li>
        </ul>
      </div>
    </div>
    <hr />
    <p class="copyright">TalentoTech &copy; Carlos Gould</p>
  </div>
</div>
  
 <!-- Scripts del carrito -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/obtener_productos.js"></script>
    <script src="js/app.js"></script>    
</body>
</html>
