<!-- formulario de registro-->
<body>
<div class="container">
    <h2>Registro de Suscripcion</h2>
<section id="Registro">
<form
  action="https://formspree.io/f/mjywjpgw"
  class="fs-form"
  target="_top"
  method="POST"

>
  <div class="fs-field">
    <label class="fs-label" for="full-name">Nombre Completo</label>
    <input
      class="fs-input"
      id="full-name"
      name="full-name"
      placeholder="Ingrese su nombre completo"
    />
  </div>
  <div class="fs-field">
    <label class="fs-label" for="email-address">Dirección de Email</label>
    <input
      class="fs-input"
      id="email-address"
      name="email-address"
      placeholder="Ingrese su dirección de email"
      required
    />
  </div>
  <div class="fs-checkbox-field">
    <div class="fs-checkbox-wrapper">
      <input
        aria-describedby="newsletter-consent-description"
        class="fs-checkbox"
        id="newsletter-consent"
        name="newsletter-consent"
        required
        type="checkbox"
        value="yes"
      />
    </div>
    <div>
      <label class="fs-label" for="newsletter-consent">
        Concentimiento para recibir publicidad y promociones.
      </label>
      <p class="fs-description" id="newsletter-consent-description">
        Acepto recibir publicidad y promociones de Delfina Store.
      </p>
    </div>
  </div>
  <div class="fs-checkbox-field">
    <div class="fs-checkbox-wrapper">
      <input
        aria-describedby="privacy-policy-agreement-description"
        class="fs-checkbox"
        id="privacy-policy-agreement"
        name="privacy-policy-agreement"
        required
        type="checkbox"
        value="yes"
      />
    </div>
    <div>
      <label class="fs-label" for="privacy-policy-agreement">
        Acepto la Política de Privacidad
      </label>
      <p class="fs-description" id="privacy-policy-agreement-description">
        He leído y acepto la Política de Privacidad.
      </p>
    </div>
  </div>
  <div class="fs-button-group">
    <button class="fs-button" type="submit">Subscribirse</button>
  </div>
</form>
</div>
</body>
