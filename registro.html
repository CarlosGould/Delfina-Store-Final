<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Delfina Store</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/Registro.css" />
    <link rel="stylesheet" href="./css/home.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="navbar">
          <a class="logo" href="./index.html">
            <img src="./img/logopng.png" alt="Delfina Store" width="145" />
          </a>
          <nav aria-label="Navegación principal">
            <ul id="MenuItems">
              <li><a href="./index.html">Home</a></li>
              <li><a href="./productos.html">Productos</a></li>
              <li><a href="./contacto.html">Contacto</a></li>
              <li><a href="./registro.html">Registro</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main class="container my-5">
      <h1>Registro de suscripción</h1>
      <section id="Registro">
        <form action="https://formspree.io/f/mjywjpgw" class="fs-form" target="_top" method="POST">
          <div class="fs-field">
            <label class="fs-label" for="full-name">Nombre Completo</label>
            <input class="fs-input" id="full-name" name="full-name" placeholder="Ingrese su nombre completo" />
          </div>
          <div class="fs-field">
            <label class="fs-label" for="email-address">Dirección de Email</label>
            <input class="fs-input" id="email-address" name="email-address" type="email" placeholder="Ingrese su dirección de email" required />
          </div>
          <div class="fs-checkbox-field">
            <input aria-describedby="newsletter-consent-description" class="fs-checkbox" id="newsletter-consent" name="newsletter-consent" required type="checkbox" value="yes" />
            <div>
              <label class="fs-label" for="newsletter-consent">Consentimiento para recibir publicidad y promociones.</label>
              <p class="fs-description" id="newsletter-consent-description">Acepto recibir publicidad y promociones de Delfina Store.</p>
            </div>
          </div>
          <div class="fs-checkbox-field">
            <input aria-describedby="privacy-policy-agreement-description" class="fs-checkbox" id="privacy-policy-agreement" name="privacy-policy-agreement" required type="checkbox" value="yes" />
            <div>
              <label class="fs-label" for="privacy-policy-agreement">Acepto la Política de Privacidad</label>
              <p class="fs-description" id="privacy-policy-agreement-description">He leído y acepto la Política de Privacidad.</p>
            </div>
          </div>
          <div class="fs-button-group">
            <button class="fs-button" type="submit">Subscribirse</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="container">
      <div class="footer-col-4">
        <h3>Siguenos en nuestras redes!!</h3>
        <ul>
          <li>Facebook</li>
          <li>Twitter</li>
          <li>Instagram</li>
          <li>YouTube</li>
        </ul>
      </div>
      <hr />
      <p class="copyright">TalentoTech &copy; Carlos Gould</p>
    </footer>
  </body>
</html>
